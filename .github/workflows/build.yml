name: Build OverImage Tweak

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          make \
          clang \
          libstdc++-12-dev \
          libstdc++6 \
          curl \
          lz4 \
          wget \
          xz-utils \
          ca-certificates
    
    - name: Setup Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
    
    - name: Download iOS SDK
      run: |
        mkdir -p ~/theos/sdks
        cd ~/theos/sdks
        echo "Downloading iOS 16.5 SDK..."
        wget https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
        tar xf iPhoneOS16.5.sdk.tar.xz
        rm -f *.tar.xz
        ls -la
    
    - name: Setup iOS toolchain
      run: |
        mkdir -p ~/theos/toolchain/linux/iphone/bin
        # Create wrapper scripts for clang
        cat > ~/theos/toolchain/linux/iphone/bin/clang << 'EOF'
#!/bin/bash
# iOS clang wrapper - uses system clang with iOS SDK
THEOS_SDK_PATH="${THEOS_SDK_PATH:-$HOME/theos/sdks/iPhoneOS16.5.sdk}"
THEOS="${THEOS:-$HOME/theos}"

# Extract architecture from arguments
ARCH="arm64"
for arg in "$@"; do
  if [[ "$arg" == "-arch" ]]; then
    ARCH="${!#}"
  fi
done

# Map iOS architectures
case "$ARCH" in
  arm64e|arm64) TARGET_ARCH="arm64" ;;
  armv7) TARGET_ARCH="armv7" ;;
  *) TARGET_ARCH="$ARCH" ;;
esac

# Use system clang (we'll accept the compilation will be for Linux but headers from iOS SDK)
/usr/bin/clang \
  -isysroot "$THEOS_SDK_PATH" \
  -I"$THEOS_SDK_PATH/usr/include" \
  -I"$THEOS/vendor/include" \
  "$@"
EOF
        chmod +x ~/theos/toolchain/linux/iphone/bin/clang
        
        # Create clang++ wrapper
        cat > ~/theos/toolchain/linux/iphone/bin/clang++ << 'EOF'
#!/bin/bash
THEOS_SDK_PATH="${THEOS_SDK_PATH:-$HOME/theos/sdks/iPhoneOS16.5.sdk}"
THEOS="${THEOS:-$HOME/theos}"

ARCH="arm64"
for arg in "$@"; do
  if [[ "$arg" == "-arch" ]]; then
    ARCH="${!#}"
  fi
done

case "$ARCH" in
  arm64e|arm64) TARGET_ARCH="arm64" ;;
  armv7) TARGET_ARCH="armv7" ;;
  *) TARGET_ARCH="$ARCH" ;;
esac

/usr/bin/clang++ \
  -isysroot "$THEOS_SDK_PATH" \
  -I"$THEOS_SDK_PATH/usr/include" \
  -I"$THEOS/vendor/include" \
  "$@"
EOF
        chmod +x ~/theos/toolchain/linux/iphone/bin/clang++
    
    - name: Clean build directory
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$THEOS/toolchain/linux/iphone/bin:$PATH
        cd ${{ github.workspace }}
        make clean
      env:
        THEOS_SDK_PATH: ${{ runner.temp }}/theos/sdks/iPhoneOS16.5.sdk
    
    - name: Build tweak package
      run: |
        export THEOS=~/theos
        export PATH=$THEOS/bin:$THEOS/toolchain/linux/iphone/bin:$PATH
        export THEOS_SDK_PATH=~/theos/sdks/iPhoneOS16.5.sdk
        cd ${{ github.workspace }}
        make package
    
    - name: List build artifacts
      if: always()
      run: |
        echo "=== Packages directory ==="
        ls -lah packages/ 2>/dev/null || echo "No packages directory"
        echo ""
        echo "=== Build objects ==="
        find .theos/obj -name "*.o" 2>/dev/null | head -10 || echo "No object files"
    
    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: OverImage-Tweak-Package
        path: packages/
        retention-days: 30
    
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: Build-Logs
        path: |
          .theos/
          Makefile
        retention-days: 7
